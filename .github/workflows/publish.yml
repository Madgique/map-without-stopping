name: Publish to Modrinth and CurseForge

on:
  push:
    tags:
      - '1.18.2/v*' # Tags spécifiques à cette branche : 1.18.2/v1.1.0
  workflow_dispatch: # Permet de relancer manuellement depuis l'onglet Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Extract version from tag
        id: get_version
        # Tag format: 1.18.2/v1.1.0 -> extracts 1.1.0
        run: |
          VERSION=${GITHUB_REF#refs/tags/1.18.2/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Publish Forge to Modrinth and CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          files: forge/build/libs/*-forge.jar
          name: Map Without Stopping ${{ steps.get_version.outputs.VERSION }}+1.18.2 (Forge)
          version: ${{ steps.get_version.outputs.VERSION }}+1.18.2-forge
          version-type: release

          loaders: forge
          game-versions: "1.18.2"

          java: 17
          modrinth-featured: true
          curseforge-client-side: required
          curseforge-server-side: unsupported
          fail-mode: skip

          changelog-file: CHANGELOG.md

      - name: Publish Fabric to Modrinth and CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          files: fabric/build/libs/*-fabric.jar
          name: Map Without Stopping ${{ steps.get_version.outputs.VERSION }}+1.18.2 (Fabric)
          version: ${{ steps.get_version.outputs.VERSION }}+1.18.2-fabric
          version-type: release

          loaders: fabric
          game-versions: "1.18.2"

          dependencies: |
            fabric-api(required)

          java: 17
          modrinth-featured: true
          curseforge-client-side: required
          curseforge-server-side: unsupported
          fail-mode: skip

          changelog-file: CHANGELOG.md
