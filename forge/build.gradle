plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    forge()
}

loom {
    forge {
        mixinConfig 'map_without_stopping.mixins.json'
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowCommon {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.minecraft_version-$rootProject.forge_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionForge')) { transitive = false }
}

processResources {
    inputs.property 'mod_version', project.version
    inputs.property 'mod_id', rootProject.mod_id
    inputs.property 'mod_display_name', rootProject.mod_display_name
    inputs.property 'mod_description', rootProject.mod_description
    inputs.property 'mod_authors', rootProject.mod_authors
    inputs.property 'mod_credits', rootProject.mod_credits
    inputs.property 'mod_license', rootProject.mod_license
    inputs.property 'mod_issue_tracker_url', rootProject.mod_issue_tracker_url

    filesMatching('META-INF/mods.toml') {
        expand mod_version: project.version,
                mod_id: rootProject.mod_id,
                mod_display_name: rootProject.mod_display_name,
                mod_description: rootProject.mod_description,
                mod_authors: rootProject.mod_authors,
                mod_credits: rootProject.mod_credits,
                mod_license: rootProject.mod_license,
                mod_issue_tracker_url: rootProject.mod_issue_tracker_url
    }
}

shadowJar {
    exclude 'fabric.mod.json'

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = null
}

jar {
    archiveClassifier = 'dev'
}

sourcesJar {
    def commonSources = project(':common').sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}
